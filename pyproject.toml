[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kirchcig"
dynamic = ["version"]
description = "GPU Kirchhoff migration to common-image gathers, and its exact adjoint."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "kirchcig contributors" }]
keywords = ["seismic", "kirchhoff", "migration", "common-image-gather", "cuda", "cupy", "adjoint", "least-squares-migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
eikonal = ["scikit-fmm"]
cuda12 = ["cupy-cuda12x"]
cuda11 = ["cupy-cuda11x"]
torch = ["torch"]
test = ["pytest", "scipy", "scikit-fmm"]

[project.urls]
Homepage = "https://github.com/zzzzswh/kirchcig"
Repository = "https://github.com/zzzzswh/kirchcig"
Issues = "https://github.com/zzzzswh/kirchcig/issues"
Changelog = "https://github.com/zzzzswh/kirchcig/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "kirchcig._version.__version__" }

[tool.setuptools.packages.find]
include = ["kirchcig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["matplotlib>=3.10.9"]
