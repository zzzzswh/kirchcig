name: CI
on: [push, pull_request]
jobs:
  numpy-engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q          # dot-product tests, engine-independent checks; cuda tests skip
  # The cuda tests (tests marked needs_cuda) run on a self-hosted GPU runner:
  #   pip install -e ".[test,cuda12]" && pytest -q
